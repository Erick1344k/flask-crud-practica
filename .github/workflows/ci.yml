name: CI Python Flask

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f Python-flask-crud-app/requirements.txt ]; then pip install -r Python-flask-crud-app/requirements.txt; else pip install flask; fi

    - name: Validar sintaxis del proyecto
      run: |
        python -m py_compile Python-flask-crud-app/*.py
