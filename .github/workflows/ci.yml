name: CI Python Flask

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flask

    - name: Mostrar estructura de archivos y compilar
      run: |
        echo "=== Estructura del repositorio ==="
        find . -maxdepth 3 -not -path '*/.*'
        echo "=== Compilando archivos Python encontrados ==="
        python -m py_compile $(find . -name "*.py" -not -path "./.github/*")
