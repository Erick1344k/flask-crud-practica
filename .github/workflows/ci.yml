name: CI Python Flask

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flask

    - name: Compilar archivos Python de la aplicación
      run: |
        for file in $(find Python-Flask-CRUD-App -name "*.py"); do
          echo "Compilando $file"
          python -m py_compile "$file"
        done

    - name: Generar reporte de integración continua
      run: |
        echo "### 📊 Reporte de Integración Continua (CI) - GESCONSOF" >> $GITHUB_STEP_SUMMARY
        echo "| Componente | Estado | Detalle |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| **Entorno** | ✅ OK | Python 3.10 configurado correctamente |" >> $GITHUB_STEP_SUMMARY
        echo "| **Dependencias** | ✅ OK | Flask instalado con éxito |" >> $GITHUB_STEP_SUMMARY
        echo "| **Compilación** | ✅ OK | Archivos `.py` verificados sin errores de sintaxis |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Resultado**: Pipeline ejecutado exitosamente para la Sesión 3." >> $GITHUB_STEP_SUMMARY
